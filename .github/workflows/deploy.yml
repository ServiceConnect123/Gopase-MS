name: CD - Build & Deploy (QA / Prod)

# Despliegue continuo, en dos fases separadas (jobs):
#   build   -> construye y publica la imagen en Docker Hub
#   deploy  -> dispara el deploy en Render y espera a que quede "live"
#
#   - push a rama `qa`   -> imagen :qa      -> deploy servicio Render QA
#   - push a rama `main` -> imagen :latest  -> deploy servicio Render Producción
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ DÓNDE SE CONFIGURAN / CAMBIAN LAS CREDENCIALES                              │
# │                                                                             │
# │ NO van en este archivo. Se guardan en el GitHub Environment "DOCKERHUB_USERNAME": │
# │   https://github.com/ServiceConnect123/Gopase-MS/settings/environments      │
# │   (repo -> Settings -> Environments -> DOCKERHUB_USERNAME -> Add secret)     │
# │   Cada job declara `environment: DOCKERHUB_USERNAME` para poder leerlos.     │
# │                                                                             │
# │ Para ROTARLAS: genera el valor nuevo (Docker Hub / Render) y edítalo en esa │
# │ misma página. No hay que tocar este YAML: se leen por nombre en runtime.    │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Secrets que consume este workflow (por nombre):
#   DOCKERHUB_USERNAME      -> usuario de Docker Hub (ej: williams2022)
#   DOCKERHUB_TOKEN         -> access token de Docker Hub (Account -> Security -> Access Tokens)
#   RENDER_API_KEY          -> API key de Render (Account Settings -> API Keys)
#   RENDER_SERVICE_ID_QA    -> srv-daj1f2h5efls73f8jh40
#   RENDER_SERVICE_ID_PROD  -> srv-dacpm40ae00c73deqjhg

on:
  push:
    branches: [qa, main]

concurrency:
  # Evita despliegues solapados por rama.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # FASE 1: BUILD - construye y publica la imagen en Docker Hub
  # ==========================================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    outputs:
      app_env: ${{ steps.env.outputs.app_env }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Falla temprano y con mensaje claro si faltan credenciales de build.
      - name: Check required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DOCKERHUB_USERNAME" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DOCKERHUB_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets en el environment DOCKERHUB_USERNAME:$missing"
            exit 1
          fi
          echo "Secrets de build presentes."

      # Determina entorno y tag de imagen según la rama.
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=qa" >> "$GITHUB_OUTPUT"
            echo "image_tag=qa" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=${{ steps.env.outputs.app_env }}
          # Publicamos el tag del entorno y además el SHA para trazabilidad.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wspsend-ms:${{ steps.env.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/wspsend-ms:${{ steps.env.outputs.app_env }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # FASE 2: DEPLOY - dispara Render y espera a que quede "live"
  # Solo corre si la fase build terminó bien (needs: build).
  # ==========================================================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    needs: build
    steps:
      # Resuelve el service id de Render según la rama y valida que exista.
      - name: Resolve Render service
        id: svc
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_PROD }}"
            NEED="RENDER_SERVICE_ID_PROD"
          else
            SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_QA }}"
            NEED="RENDER_SERVICE_ID_QA"
          fi
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Falta el secret $NEED en el environment DOCKERHUB_USERNAME."
            exit 1
          fi
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "::error::Falta el secret RENDER_API_KEY en el environment DOCKERHUB_USERNAME."
            exit 1
          fi
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy & wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          echo "🚀 Disparando deploy en Render para servicio '$SERVICE_ID' (imagen ${{ needs.build.outputs.image_tag }}) ..."

          # Capturamos body y HTTP status por separado para mostrar el error
          # real de la API en vez de reventar al parsear JSON vacío.
          RESP=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          HTTP_CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Render respondió HTTP $HTTP_CODE al crear el deploy."
            echo "Respuesta: $BODY"
            echo "Verifica RENDER_API_KEY y que el service id '$SERVICE_ID' sea correcto."
            exit 1
          fi

          DEPLOY_ID=$(printf '%s' "$BODY" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Deploy creado: $DEPLOY_ID"
          echo "Siguiendo el estado en Render (esto queda 'pendiente' hasta que Render termine)..."

          # Poll hasta que el deploy termine (live) o falle.
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sS --fail \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Estado del deploy: $STATUS"
            case "$STATUS" in
              live)
                echo "✅ Deploy en Render completado (live)."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::El deploy en Render falló con estado: $STATUS"
                exit 1
                ;;
            esac
          done
          echo "::error::Timeout esperando que Render deje el deploy en 'live'."
          exit 1
