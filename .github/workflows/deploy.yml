name: CD - Build & Deploy (QA / Prod)

# Despliegue continuo:
#   - push a rama `qa`   -> imagen :qa      -> deploy servicio Render QA
#   - push a rama `main` -> imagen :latest  -> deploy servicio Render Producción
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ DÓNDE SE CONFIGURAN / CAMBIAN LAS CREDENCIALES                              │
# │                                                                             │
# │ NO van en este archivo. Se guardan como "Repository secrets" aquí:          │
# │   https://github.com/ServiceConnect123/Gopase-MS/settings/secrets/actions   │
# │   (repo -> Settings -> Secrets and variables -> Actions -> New/editar)      │
# │                                                                             │
# │ Para ROTARLAS: genera el valor nuevo (Docker Hub / Render) y edítalo en esa │
# │ misma página. No hay que tocar este YAML: se leen por nombre en runtime.    │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Secrets que consume este workflow (por nombre):
#   DOCKERHUB_USERNAME      -> usuario de Docker Hub (ej: williams2022)
#   DOCKERHUB_TOKEN         -> access token de Docker Hub (Account -> Security -> Access Tokens)
#   RENDER_API_KEY          -> API key de Render (Account Settings -> API Keys)
#   RENDER_SERVICE_ID_QA    -> srv-daj1f2h5efls73f8jh40
#   RENDER_SERVICE_ID_PROD  -> srv-dacpm40ae00c73deqjhg
#
# Cada paso de abajo referencia su secret con ${{ secrets.NOMBRE }}, así que
# también puedes ver "dónde se usa cada uno" leyendo el job.

on:
  push:
    branches: [qa, main]

concurrency:
  # Evita despliegues solapados por rama.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determina entorno, tag de imagen y service id según la rama.
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "service_id=${{ secrets.RENDER_SERVICE_ID_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=qa" >> "$GITHUB_OUTPUT"
            echo "image_tag=qa" >> "$GITHUB_OUTPUT"
            echo "service_id=${{ secrets.RENDER_SERVICE_ID_QA }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=${{ steps.env.outputs.app_env }}
          # Publicamos el tag del entorno y además el SHA para trazabilidad.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wspsend-ms:${{ steps.env.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/wspsend-ms:${{ steps.env.outputs.app_env }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dispara el deploy en Render vía API y espera a que termine.
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.env.outputs.service_id }}
        run: |
          set -euo pipefail
          echo "Disparando deploy en Render para $SERVICE_ID ..."
          DEPLOY_ID=$(curl -sS --fail -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Deploy creado: $DEPLOY_ID"

          # Poll hasta que el deploy termine (live) o falle.
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sS --fail \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Estado del deploy: $STATUS"
            case "$STATUS" in
              live)
                echo "✅ Deploy completado."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "❌ Deploy falló con estado: $STATUS"
                exit 1
                ;;
            esac
          done
          echo "⏱️ Timeout esperando el deploy."
          exit 1
