name: CD - Build, Push & Deploy (QA / Prod)

# Despliegue continuo en tres fases separadas (jobs):
#   build   -> construye la imagen y la exporta como artefacto (.tar)
#   push    -> descarga el artefacto y publica la imagen en Docker Hub
#   deploy  -> dispara el deploy en Render y espera a que quede "live"
#
#   - push a rama `qa`   -> imagen :qa      -> deploy servicio Render QA
#   - push a rama `main` -> imagen :latest  -> deploy servicio Render Producción
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ DÓNDE SE CONFIGURAN / CAMBIAN LAS CREDENCIALES                              │
# │                                                                             │
# │ NO van en este archivo. Se guardan en el GitHub Environment "DOCKERHUB_USERNAME": │
# │   https://github.com/ServiceConnect123/Gopase-MS/settings/environments      │
# │   (repo -> Settings -> Environments -> DOCKERHUB_USERNAME -> Add secret)     │
# │   Los jobs que los usan declaran `environment: DOCKERHUB_USERNAME`.          │
# │                                                                             │
# │ Para ROTARLAS: genera el valor nuevo (Docker Hub / Render) y edítalo en esa │
# │ misma página. No hay que tocar este YAML: se leen por nombre en runtime.    │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Secrets que consume este workflow (por nombre):
#   DOCKERHUB_USERNAME      -> usuario de Docker Hub (ej: williams2022)
#   DOCKERHUB_TOKEN         -> access token de Docker Hub (Account -> Security -> Access Tokens)
#   RENDER_API_KEY          -> API key de Render (Account Settings -> API Keys)
#   RENDER_SERVICE_ID_QA    -> srv-daj1f2h5efls73f8jh40
#   RENDER_SERVICE_ID_PROD  -> srv-dacpm40ae00c73deqjhg

on:
  push:
    branches: [qa, main]

concurrency:
  # Evita despliegues solapados por rama.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # FASE 1: BUILD - construye la imagen y la exporta como artefacto (.tar)
  # No publica nada; solo compila y deja la imagen lista para la fase push.
  # ==========================================================================
  build:
    name: Build image
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    outputs:
      app_env: ${{ steps.env.outputs.app_env }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      image_ref: ${{ steps.env.outputs.image_ref }}
      image_ref_sha: ${{ steps.env.outputs.image_ref_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Falta el secret DOCKERHUB_USERNAME en el environment DOCKERHUB_USERNAME."
            exit 1
          fi
          echo "Username presente."

      # Determina entorno, tag y las referencias completas de la imagen.
      - name: Resolve environment
        id: env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            APP_ENV=production
            IMAGE_TAG=latest
          else
            APP_ENV=qa
            IMAGE_TAG=qa
          fi
          IMAGE_REF="$DOCKERHUB_USERNAME/wspsend-ms:$IMAGE_TAG"
          IMAGE_REF_SHA="$DOCKERHUB_USERNAME/wspsend-ms:$APP_ENV-${{ github.sha }}"
          {
            echo "app_env=$APP_ENV"
            echo "image_tag=$IMAGE_TAG"
            echo "image_ref=$IMAGE_REF"
            echo "image_ref_sha=$IMAGE_REF_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      # Construye la imagen SIN push y la exporta a un tar local.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_ENV=${{ steps.env.outputs.app_env }}
          tags: |
            ${{ steps.env.outputs.image_ref }}
            ${{ steps.env.outputs.image_ref_sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ==========================================================================
  # FASE 2: PUSH - descarga la imagen construida y la publica en Docker Hub
  # ==========================================================================
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    needs: build
    steps:
      - name: Check Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Falta el secret DOCKERHUB_TOKEN en el environment DOCKERHUB_USERNAME."
            exit 1
          fi
          echo "Token presente."

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image into Docker
        run: docker load --input /tmp/image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image tags
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_REF_SHA: ${{ needs.build.outputs.image_ref_sha }}
        run: |
          set -euo pipefail
          echo "Publicando $IMAGE_REF ..."
          docker push "$IMAGE_REF"
          echo "Publicando $IMAGE_REF_SHA ..."
          docker push "$IMAGE_REF_SHA"
          echo "✅ Imagen publicada en Docker Hub."

  # ==========================================================================
  # FASE 3: DEPLOY - dispara Render y espera a que quede "live"
  # Solo corre si push terminó bien (needs: push).
  # ==========================================================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    needs: [build, push]
    steps:
      - name: Resolve Render service
        id: svc
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_PROD }}"
            NEED="RENDER_SERVICE_ID_PROD"
          else
            SERVICE_ID="${{ secrets.RENDER_SERVICE_ID_QA }}"
            NEED="RENDER_SERVICE_ID_QA"
          fi
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Falta el secret $NEED en el environment DOCKERHUB_USERNAME."
            exit 1
          fi
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "::error::Falta el secret RENDER_API_KEY en el environment DOCKERHUB_USERNAME."
            exit 1
          fi
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy & wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.svc.outputs.service_id }}
        run: |
          set -euo pipefail
          echo "🚀 Disparando deploy en Render para servicio '$SERVICE_ID' (imagen ${{ needs.build.outputs.image_ref }}) ..."

          # Capturamos body y HTTP status por separado para mostrar el error
          # real de la API en vez de reventar al parsear JSON vacío.
          RESP=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          HTTP_CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')

          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::error::Render respondió HTTP $HTTP_CODE al crear el deploy."
            echo "Respuesta: $BODY"
            echo "Verifica RENDER_API_KEY y que el service id '$SERVICE_ID' sea correcto."
            exit 1
          fi

          DEPLOY_ID=$(printf '%s' "$BODY" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Deploy creado: $DEPLOY_ID"
          echo "Siguiendo el estado en Render (esto queda 'pendiente' hasta que Render termine)..."

          # Poll hasta que el deploy termine (live) o falle.
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sS --fail \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
            echo "Estado del deploy: $STATUS"
            case "$STATUS" in
              live)
                echo "✅ Deploy en Render completado (live)."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::El deploy en Render falló con estado: $STATUS"
                exit 1
                ;;
            esac
          done
          echo "::error::Timeout esperando que Render deje el deploy en 'live'."
          exit 1
